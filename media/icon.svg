<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="72%">
      <stop offset="0" stop-color="#3a2a78"/>
      <stop offset="0.55" stop-color="#1a1340"/>
      <stop offset="1" stop-color="#08061a"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe08a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffe08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff1b8" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#ffe08a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffe08a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.45" stop-color="#e5b94c"/>
      <stop offset="1" stop-color="#8f5f17"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8642f"/>
      <stop offset="0.5" stop-color="#7a4220"/>
      <stop offset="1" stop-color="#46230f"/>
    </linearGradient>
    <linearGradient id="lidInside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1d0c"/>
      <stop offset="1" stop-color="#6b3a1a"/>
    </linearGradient>
    <linearGradient id="macroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a2a6e"/>
      <stop offset="1" stop-color="#1c0c26"/>
    </linearGradient>
    <linearGradient id="keyBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d5c9a"/>
      <stop offset="1" stop-color="#0c1d36"/>
    </linearGradient>
    <linearGradient id="gearBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f7a6e"/>
      <stop offset="1" stop-color="#082622"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3f8"/>
      <stop offset="0.5" stop-color="#a9b8c8"/>
      <stop offset="1" stop-color="#5d6e82"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#fff6d0" opacity="0.8">
    <circle cx="34" cy="74" r="1.6"/><circle cx="372" cy="330" r="1.8"/><circle cx="120" cy="22" r="1.4"/>
    <circle cx="300" cy="384" r="1.4"/><circle cx="22" cy="300" r="1.8"/><circle cx="384" cy="118" r="1.4"/>
    <circle cx="262" cy="30" r="1.4"/><circle cx="56" cy="210" r="1.4"/>
  </g>

  <!-- glow and shadow -->
  <circle cx="200" cy="200" r="170" fill="url(#aura)"/>
  <ellipse cx="200" cy="352" rx="128" ry="16" fill="#000000" opacity="0.45"/>

  <!-- light pouring out -->
  <path d="M108,252 L292,252 L372,40 L28,40 Z" fill="url(#beam)"/>

  <!-- open lid (its inside faces us) -->
  <path d="M104,252 L296,252 L284,196 Q200,182 116,196 Z" fill="url(#lidInside)" stroke="#2a1a10" stroke-width="6" stroke-linejoin="round"/>
  <g stroke="#2a1a10" stroke-width="3" opacity="0.6">
    <path d="M112,214 Q200,204 288,214"/><path d="M108,234 Q200,226 292,234"/>
  </g>
  <path d="M116,196 Q200,182 284,196" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>

  <!-- floating action buttons: macro, key binding, settings -->
  <g filter="url(#glow)">
    <!-- macro: the red question mark -->
    <g transform="translate(110 150) rotate(-12)">
      <rect x="-34" y="-34" width="68" height="68" rx="10" fill="url(#macroBg)" stroke="url(#gold)" stroke-width="6"/>
      <text x="0" y="20" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="56" fill="#ff4a3d" stroke="#5a0d08" stroke-width="2.5">?</text>
    </g>
    <!-- key binding: a keycap -->
    <g transform="translate(200 98)">
      <rect x="-38" y="-38" width="76" height="76" rx="11" fill="url(#keyBg)" stroke="url(#gold)" stroke-width="6"/>
      <rect x="-24" y="-22" width="48" height="48" rx="8" fill="#7d8aa0"/>
      <rect x="-24" y="-26" width="48" height="42" rx="8" fill="#eef2f7"/>
      <text x="0" y="9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="30" fill="#1c2638">Q</text>
    </g>
    <!-- settings: a gear -->
    <g transform="translate(290 150) rotate(12)">
      <rect x="-34" y="-34" width="68" height="68" rx="10" fill="url(#gearBg)" stroke="url(#gold)" stroke-width="6"/>
      <circle r="18" fill="none" stroke="url(#steel)" stroke-width="10" stroke-dasharray="7.1 7.04"/>
      <circle r="15" fill="url(#steel)"/>
      <circle r="6" fill="#082622"/>
    </g>
  </g>

  <!-- the opening, glowing -->
  <ellipse cx="200" cy="252" rx="98" ry="13" fill="#fff6d0" filter="url(#glow)"/>

  <!-- chest body -->
  <rect x="100" y="250" width="200" height="96" rx="10" fill="url(#wood)" stroke="#2a1a10" stroke-width="6"/>
  <g stroke="#3a1d0c" stroke-width="3" opacity="0.7">
    <path d="M104,282 H296"/><path d="M104,314 H296"/>
  </g>
  <!-- gold bands -->
  <g fill="url(#gold)" stroke="#2a1a10" stroke-width="4" stroke-linejoin="round">
    <rect x="100" y="250" width="200" height="16" rx="4"/>
    <rect x="124" y="250" width="18" height="96"/>
    <rect x="258" y="250" width="18" height="96"/>
  </g>
  <g fill="#2a1a10">
    <circle cx="133" cy="296" r="3"/><circle cx="133" cy="330" r="3"/>
    <circle cx="267" cy="296" r="3"/><circle cx="267" cy="330" r="3"/>
  </g>
  <!-- lock plate -->
  <rect x="180" y="262" width="40" height="44" rx="8" fill="url(#gold)" stroke="#2a1a10" stroke-width="4"/>
  <circle cx="200" cy="280" r="6" fill="#2a1a10"/>
  <path d="M196,282 L193,296 H207 L204,282 Z" fill="#2a1a10"/>
  <path d="M106,262 Q150,256 194,262" fill="none" stroke="#fff6d0" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- sparkles -->
  <g fill="#fff6d0">
    <path d="M352,52 Q354,64 366,66 Q354,68 352,80 Q350,68 338,66 Q350,64 352,52 Z"/>
    <path d="M52,30 Q53.5,39 62,40.5 Q53.5,42 52,51 Q50.5,42 42,40.5 Q50.5,39 52,30 Z"/>
    <path d="M346,236 Q347.5,245 356,246.5 Q347.5,248 346,257 Q344.5,248 336,246.5 Q344.5,245 346,236 Z"/>
    <path d="M60,250 Q61.2,257 68,258.2 Q61.2,259.4 60,266 Q58.8,259.4 52,258.2 Q58.8,257 60,250 Z"/>
    <path d="M200,10 Q201.2,17 208,18.2 Q201.2,19.4 200,26 Q198.8,19.4 192,18.2 Q198.8,17 200,10 Z"/>
  </g>
</svg>
